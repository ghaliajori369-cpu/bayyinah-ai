<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة بَيِّنَة</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#1a3a5f;
  --gold:#c9a66b;
  --bg:#f8f9fa;
  --white:#ffffff;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:'Cairo','Tajawal',sans-serif;
  background:var(--bg);
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar {
  width:260px;
  background:var(--primary);
  color:white;
  display:flex;
  flex-direction:column;
  padding:15px;
}

.sidebar h2 {
  margin:0 0 20px;
}

.new-chat {
  background:var(--gold);
  border:none;
  padding:10px;
  cursor:pointer;
  font-weight:bold;
}

.chat-list {
  margin-top:20px;
  flex:1;
  overflow:auto;
}

.chat-item {
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  cursor:pointer;
}

/* Main */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Chat */
.chat {
  flex:1;
  overflow:auto;
  padding:20px;
}

.message {
  max-width:75%;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  white-space:pre-wrap;
}

.user {
  background:var(--primary);
  color:white;
  margin-left:auto;
}

.ai {
  background:white;
  border:1px solid #ddd;
}

/* Actions */
.actions {
  margin-top:8px;
}

button.small {
  font-size:12px;
  padding:5px 8px;
  margin-left:5px;
  cursor:pointer;
}

/* Input */
.input-box {
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
  background:white;
}

textarea {
  flex:1;
  resize:none;
  padding:10px;
  font-size:16px;
  font-family:inherit;
}

.send-btn {
  background:var(--gold);
  border:none;
  padding:10px 15px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>بَيِّنَة</h2>
  <button class="new-chat" onclick="newChat()">+ محادثة جديدة</button>

  <div class="chat-list" id="chatList"></div>

  <div style="font-size:12px;">
    دعم: support@bayinah.sa
  </div>
</div>

<!-- Main -->
<div class="main">

  <div class="chat" id="chat"></div>

  <div class="input-box">
    <textarea id="input" rows="2" placeholder="اكتب سؤالك القانوني..."></textarea>
    <button class="send-btn" onclick="sendMessage()">إرسال</button>
  </div>

</div>

<script>
/* ===================== CONFIG ===================== */
const GROQ_API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; // ⚠️ ضع مفتاحك هنا

const SYSTEM_PROMPT = `
أنت مساعد قانوني سعودي متخصص.

التزم بالتالي:
- الأنظمة السعودية المحدثة
- لا تؤلف معلومات
- حلل السؤال بدقة

قسم الإجابة إلى:
1) الوصف النظامي
2) المواد القانونية ذات الصلة
3) التوصية

اكتب بأسلوب رسمي واضح.
`;

/* ===================== STATE ===================== */
let chats = [];
let currentChat = [];

/* ===================== UI ===================== */
function addMessage(text, type="user") {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  if(type === "ai") {
    const actions = document.createElement("div");
    actions.className = "actions";

    const copyBtn = document.createElement("button");
    copyBtn.className = "small";
    copyBtn.textContent = "نسخ";
    copyBtn.onclick = () => navigator.clipboard.writeText(text);

    const printBtn = document.createElement("button");
    printBtn.className = "small";
    printBtn.textContent = "طباعة";
    printBtn.onclick = () => printText(text);

    actions.appendChild(copyBtn);
    actions.appendChild(printBtn);

    div.appendChild(actions);
  }

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

function newChat() {
  currentChat = [];
  document.getElementById("chat").innerHTML = "";
}

/* ===================== PRINT ===================== */
function printText(text) {
  const w = window.open("", "", "width=800,height=600");
  w.document.write(`<pre style="font-family:Cairo">${text}</pre>`);
  w.print();
}

/* ===================== SEND ===================== */
async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  currentChat.push({role:"user", content:text});

  const messages = [
    {role:"system", content:SYSTEM_PROMPT},
    ...currentChat
  ];

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{
        "Authorization":`Bearer ${GROQ_API_KEY}`,
        "Content-Type":"application/json; charset=UTF-8"
      },
      body:JSON.stringify({
        model:"llama-3.3-70b-versatile",
        messages:messages,
        temperature:0.3
      })
    });

    const data = await res.json();

    const reply = data.choices[0].message.content;

    addMessage(reply, "ai");

    currentChat.push({role:"assistant", content:reply});

  } catch(err) {
    addMessage("حدث خطأ في الاتصال", "ai");
  }
}

/* ===================== SHORTCUTS ===================== */
document.getElementById("input").addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
