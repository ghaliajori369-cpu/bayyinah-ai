<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بَيّنَة</title>
    <style>
        :root { --primary: #1a3a5f; --accent: #c9a66b; }
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-container { width: 95%; max-width: 500px; background: white; height: 90vh; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--accent); font-weight: bold; }
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .bubble { padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.6; max-width: 85%; }
        .ai { background: white; border-right: 5px solid var(--primary); align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user { background: var(--primary); color: white; align-self: flex-end; }
        .input-area { padding: 20px; border-top: 1px solid #eee; background: white; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 12px; padding: 12px; resize: none; box-sizing: border-box; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        .disclaimer { font-size: 0.7rem; color: #888; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">⚖️ منصة بَيّنَة</div>
    <div id="chat-area">
        <div class="bubble ai">مرحباً بكِ.. أنا مستشارك الذكي، ضعي وقائع القضية هنا لتحليلها نظاماً.</div>
    </div>
    <div class="input-area">
        <textarea id="userInput" placeholder="اكتبي الوقائع هنا..."></textarea>
        <button id="sendBtn">تحليل الوقائع نظاماً</button>
        <div class="disclaimer">هذا التحليل تقني ولا يغني عن استشارة محامي مختص</div>
    </div>
</div>

<script>
const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; 

const SYSTEM_INSTRUCTION = "أنت مستشار قانوني سعودي. حلل الوقائع التالية بناءً على الأنظمة السعودية واذكر المواد ذات الصلة:";

const btn = document.getElementById('sendBtn');
const input = document.getElementById('userInput');
const chat = document.getElementById('chat-area');

function addMessage(text, isUser = false) {
    const msg = document.createElement('div');
    msg.className = isUser ? 'bubble user' : 'bubble ai';
    msg.innerHTML = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
}

btn.onclick = async () => {
    const val = input.value.trim();
    if (!val) return;

    addMessage(val, true);
    input.value = "";
    btn.disabled = true;
    btn.innerText = "جاري التحليل...";

    const loadingMsg = addMessage("⏳ جاري المعالجة...");

    try {
        // تم تصحيح الرابط هنا ليعمل مع gemini-1.5-flash مباشرة
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: SYSTEM_INSTRUCTION + "\n" + val }]
                }]
            })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiResponse = data.candidates[0].content.parts[0].text;
        loadingMsg.innerHTML = "<b>📋 التحليل النظامي:</b><br><br>" + aiResponse.replace(/\n/g, '<br>');

    } catch (e) {
        loadingMsg.innerText = "❌ حدث خطأ: " + e.message;
    } finally {
        btn.disabled = false;
        btn.innerText = "تحليل الوقائع نظاماً";
    }
};
</script>

</body>
</html>
