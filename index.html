<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بينة - المساعد القانوني</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a3a5f; color: white; padding: 20px; text-align: center; font-weight: bold; }
        #chatBox { height: 300px; overflow-y: auto; padding: 15px; border-bottom: 1px solid #eee; background: #fafafa; }
        .msg { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid #1a3a5f; font-size: 14px; line-height: 1.6; }
        .input-area { padding: 15px; }
        textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; resize: none; }
        button { width: 100%; background: #1a3a5f; color: white; border: none; padding: 15px; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">⚖️ بينة - المكتب الرقمي السعودي</div>
    <div id="chatBox">
        <div class="msg">مرحباً بك.. أدخل وقائع القضية لتحليلها بناءً على الأنظمة السعودية.</div>
    </div>
    <div class="input-area">
        <textarea id="caseDetails" placeholder="اكتب الوقائع هنا..."></textarea>
        <button id="btn">إعداد دراسة شاملة للمسودة</button>
    </div>
</div>

<script type="importmap">
    { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
</script>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // ضعي مفتاحك الجديد هنا في سطر واحد فقط بين علامتي الاقتباس
    const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; 

    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    document.getElementById('btn').onclick = async () => {
        const input = document.getElementById('caseDetails');
        const chatBox = document.getElementById('chatBox');
        const btn = document.getElementById('btn');
        const text = input.value.trim();

        if (!text) return alert("فضلاً اكتب الوقائع أولاً");

        btn.disabled = true;
        btn.innerText = "جاري التحليل...";

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'msg';
        loadingDiv.innerHTML = "⏳ جاري استحضار الأنظمة وتحليل النص...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const prompt = `أنت محامي سعودي مستشار. حلل الوقائع التالية واذكر المواد النظامية المناسبة: ${text}`;
            const result = await model.generateContent(prompt);
            const response = await result.response;
            loadingDiv.innerHTML = `<b>📋 النتيجة:</b><br><br>${response.text().replace(/\n/g, '<br>')}`;
        } catch (e) {
            loadingDiv.innerHTML = "❌ خطأ في الاتصال: تأكدي من صحة المفتاح.";
        } finally {
            btn.disabled = false;
            btn.innerText = "إعداد دراسة شاملة للمسودة";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    };
</script>
</body>
</html>
