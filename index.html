<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بَيّنَة</title>
    <style>
        :root { --primary: #1a3a5f; --accent: #c9a66b; }
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-container { width: 95%; max-width: 500px; background: white; height: 90vh; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--accent); }
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .bubble { padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.6; max-width: 85%; }
        .ai { background: white; border-right: 5px solid var(--primary); align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-area { padding: 20px; border-top: 1px solid #eee; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 12px; padding: 12px; resize: none; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">⚖️ منصة بَيّنَة</div>
    <div id="chat-area">
        <div class="bubble ai">مرحباً بكِ.. ضعي وقائع القضية هنا لتحليلها نظاماً.</div>
    </div>
    <div class="input-area">
        <textarea id="userInput" placeholder="اكتبي الوقائع هنا..."></textarea>
        <button id="sendBtn">تحليل الوقائع نظاماً</button>
    </div>
</div>

<script type="module">
import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

// ⚠️ استبدلي النص أدناه بمفتاحك الجديد من Google AI Studio
const KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; 

const genAI = new GoogleGenerativeAI(KEY);
const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

const btn = document.getElementById('sendBtn');
const input = document.getElementById('userInput');
const chat = document.getElementById('chat-area');

btn.onclick = async () => {
    const val = input.value.trim();
    if (!val) return;

    btn.disabled = true;
    btn.innerText = "جاري التحليل...";

    const msg = document.createElement('div');
    msg.className = 'bubble ai';
    msg.innerText = "⏳ جاري المعالجة الرقمية...";
    chat.appendChild(msg);

    try {
        // تم تبسيط الطلب لتجنب مشاكل الترميز
        const result = await model.generateContent("أنت مستشار قانوني سعودي. حلل هذه الوقائع نظاماً: " + val);
        const response = await result.response;
        const text = response.text();
        
        msg.innerHTML = "<b>📋 التحليل النظامي:</b><br><br>" + text.replace(/\n/g, '<br>');
    } catch (e) {
        msg.innerText = "❌ حدث خطأ: " + e.message;
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerText = "تحليل الوقائع نظاماً";
        chat.scrollTop = chat.scrollHeight;
    }
};
</script>

</body>
</html>
