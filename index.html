<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بينة - المستشار القانوني</title>
    <style>
        :root { --primary: #1a3a5f; --accent: #c9a66b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 95%; max-width: 500px; background: white; height: 90vh; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e0e0e0; }
        .header { background: var(--primary); color: white; padding: 25px; text-align: center; position: relative; }
        .header h2 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        .header::after { content: ""; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background: var(--accent); }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; background: #fafafa; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 14px 18px; border-radius: 18px; font-size: 1rem; line-height: 1.6; max-width: 85%; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai { background: white; border-right: 5px solid var(--accent); align-self: flex-start; box-shadow: 0 3px 10px rgba(0,0,0,0.05); color: #333; }
        .input-section { padding: 20px; border-top: 1px solid #eee; background: white; }
        textarea { width: 100%; height: 90px; border: 1.5px solid #ddd; border-radius: 15px; padding: 12px; resize: none; font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 8px rgba(26, 58, 95, 0.1); }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 15px; margin-top: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        button:hover { background: #122a46; }
        button:disabled { background: #abb8c3; cursor: not-allowed; }
        .error-text { color: #d9534f; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2>⚖️ تطبيق بَيّنَة</h2></div>
    <div id="chat-box">
        <div class="bubble ai">مرحباً بكِ في منصة بَيّنَة.. أنا مساعدكِ القانوني الذكي. كيف يمكنني مساعدتكِ اليوم في تحليل وقائع قضيتكِ؟</div>
    </div>
    <div class="input-section">
        <textarea id="userInput" placeholder="اكتبي وقائع القضية هنا بكل وضوح..."></textarea>
        <button id="sendBtn">تحليل الوقائع الآن</button>
    </div>
</div>

<script type="importmap">
{ "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
</script>

<script type="module">
import { GoogleGenerativeAI } from "@google/generative-ai";

// ضعي مفتاحك هنا بدقة بين علامتي الاقتباس
const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; 

const genAI = new GoogleGenerativeAI(API_KEY);
const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

const btn = document.getElementById('sendBtn');
const input = document.getElementById('userInput');
const chat = document.getElementById('chat-box');

btn.onclick = async () => {
    const text = input.value.trim();
    if (!text) return alert("فضلاً، وصّفي وقائع القضية أولاً.");

    btn.disabled = true;
    btn.innerText = "جاري الاتصال والتحليل...";

    const msgBox = document.createElement('div');
    msgBox.className = 'bubble ai';
    msgBox.innerHTML = "⏳ جاري استحضار الأنظمة السعودية وتحليل النص...";
    chat.appendChild(msgBox);
    chat.scrollTop = chat.scrollHeight;

    try {
        const prompt = "أنت محامي سعودي خبير ومستشار قانوني. قم بتحليل الوقائع التالية بدقة، وحدد الأنظمة السعودية ذات العلاقة والمواد النظامية المناسبة: " + text;
        const result = await model.generateContent(prompt);
        const response = await result.response;
        const output = response.text();
        
        msgBox.innerHTML = "<b>📋 التحليل القانوني المقترح:</b><br><br>" + output.replace(/\n/g, '<br>');
    } catch (error) {
        msgBox.innerHTML = "<span class='error-text'>❌ عذراً، حدث خطأ تقني:</span><br>" + error.message;
        console.error("Error details:", error);
    } finally {
        btn.disabled = false;
        btn.innerText = "تحليل الوقائع الآن";
        chat.scrollTop = chat.scrollHeight;
    }
};
</script>

</body>
</html>
