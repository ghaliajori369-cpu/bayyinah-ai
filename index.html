<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بَيِّنَة | المستشار القانوني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a3a5f; --gold: #c9a66b; --bg: #f8f9fa; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        
        /*Sidebar*/
        .sidebar { width: 280px; background: var(--primary); color: white; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar h1 { font-size: 1.8rem; border-bottom: 2px solid var(--gold); padding-bottom: 10px; text-align: center; }
        .new-chat { background: var(--gold); border: none; padding: 12px; color: var(--primary); font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; transition: 0.3s; }
        .new-chat:hover { background: #b38f55; }

        /*Main Content*/
        .main { flex: 1; display: flex; flex-direction: column; background: white; }
        #chat-window { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 85%; padding: 15px 20px; border-radius: 15px; line-height: 1.8; font-size: 1.05rem; }
        .user-msg { background: var(--primary); color: white; align-self: flex-end; border-bottom-left-radius: 2px; }
        .ai-msg { background: #f0f4f8; align-self: flex-start; border-right: 5px solid var(--gold); border-bottom-right-radius: 2px; }
        
        /*Input Area*/
        .input-area { padding: 25px; border-top: 1px solid #eee; display: flex; gap: 15px; align-items: center; }
        textarea { flex: 1; border: 2px solid #e0e0e0; border-radius: 10px; padding: 12px; resize: none; font-family: inherit; font-size: 1rem; outline: none; }
        textarea:focus { border-color: var(--gold); }
        .send-btn { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .send-btn:hover:not(:disabled) { background: var(--gold); }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        .disclaimer { font-size: 0.8rem; color: #888; text-align: center; margin-top: 5px; }

        /*Printing & Actions*/
        .msg-actions { margin-top: 10px; display: flex; gap: 10px; }
        .btn-small { font-size: 0.8rem; padding: 5px 10px; cursor: pointer; border: 1px solid #ddd; background: white; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>بَيِّنَة ⚖️</h1>
        <p style="text-align: center; font-size: 0.9rem; opacity: 0.8;">المستشار القانوني الرقمي للأنظمة السعودية</p>
        <button class="new-chat" onclick="location.reload()">+ محادثة جديدة</button>
        <div style="margin-top: auto; font-size: 0.8rem; opacity: 0.6; text-align: center;">إصدار v2.0 - Gemini Flash</div>
    </div>

    <div class="main">
        <div id="chat-window">
            <div class="message ai-msg">مرحباً بكِ في منصة بَيِّنَة. أنا مستشارك الرقمي، تفضلي بطرح وقائع قضيتكِ لتحليلها وفقاً للأنظمة السعودية.</div>
        </div>

        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="اكتبي وقائع القضية هنا..."></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()">تحليل الوقائع</button>
        </div>
        <div class="disclaimer">هذا التحليل تقني آلي ولا يغني عن استشارة محامي مختص.</div>
    </div>

    <script>
        /* ===================== الإعدادات ===================== */
        const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; 
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

        async function handleSend() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            appendMsg(text, 'user');
            input.value = '';
            btn.disabled = true;

            const loading = appendMsg("⏳ جاري تحليل الوقائع واستحضار المواد النظامية...", 'ai');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': API_KEY // الطريقة الصحيحة للمصادقة كما في التوثيق
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "أنت مستشار قانوني سعودي. حلل الوقائع التالية بدقة واذكر أرقام المواد النظامية ذات الصلة: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiReply = data.candidates[0].content.parts[0].text;
                loading.innerHTML = aiReply.replace(/\n/g, '<br>');
                
                // إضافة أزرار النسخ والطباعة
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `
                    <button class="btn-small" onclick="navigator.clipboard.writeText(\`${aiReply.replace(/`/g, '\\` ')}\`)">نسخ التحليل</button>
                    <button class="btn-small" onclick="window.print()">طباعة</button>
                `;
                loading.appendChild(actions);

            } catch (error) {
                loading.innerHTML = `<span style="color:red;">❌ خطأ في النظام: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                const win = document.getElementById('chat-window');
                win.scrollTop = win.scrollHeight;
            }
        }

        function appendMsg(content, role) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
            div.innerHTML = content;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
            return div;
        }

        // دعم الإرسال عبر Enter
        document.getElementById('userInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
