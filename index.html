<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بَيِّنَة | المستشار القانوني السعودي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a3a5f; --gold: #c9a66b; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--primary); color: white; display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: white; }
        #chat-window { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 15px; border-radius: 12px; line-height: 1.6; }
        .user-msg { background: var(--primary); color: white; align-self: flex-end; }
        .ai-msg { background: #f0f4f8; align-self: flex-start; border-right: 5px solid var(--gold); }
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; resize: none; font-family: inherit; }
        .send-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .send-btn:disabled { background: #ccc; }
        .error-msg { color: #d9534f; font-weight: bold; background: #fdf7f7; padding: 10px; border: 1px solid #d9534f; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>بَيِّنَة ⚖️</h2>
        <p style="font-size: 0.9rem; text-align: center; opacity: 0.8;">المستشار القانوني الرقمي للأنظمة السعودية</p>
        <button style="background: var(--gold); border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 20px;" onclick="location.reload()">+ محادثة جديدة</button>
    </div>

    <div class="main-content">
        <div id="chat-window">
            <div class="message ai-msg">مرحباً بكِ.. ضعي وقائع القضية هنا لتحليلها بناءً على الأنظمة السعودية.</div>
        </div>

        <div class="input-area">
            <textarea id="userInput" rows="2" placeholder="اكتبي سؤالك هنا..."></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()">تحليل نظامي</button>
        </div>
        <p style="font-size: 0.7rem; color: #888; text-align: center; margin: 5px;">هذا التحليل لا يغني عن استشارة محامي مختص.</p>
    </div>

    <script>
        /* ===================== CONFIG ===================== */
        // تم تصحيح طريقة الربط بناءً على توثيق Gemini الرسمي
        const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; 
        
        // استخدام رابط v1beta مع النموذج الصحيح كما في الصورة
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

        async function handleSend() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            
            if (!text) return;

            appendMsg(text, 'user');
            input.value = '';
            btn.disabled = true;

            const loading = appendMsg("⏳ جاري التحليل...", 'ai');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // استخدام Header الخاص بالمفتاح لتجنب أخطاء الترميز
                        'x-goog-api-key': API_KEY 
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "أنت مستشار قانوني سعودي. حلل الوقائع التالية واذكر المواد النظامية: " + text }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    // معالجة الأخطاء الظاهرة في الصور
                    throw new Error(data.error.message);
                }

                const aiReply = data.candidates[0].content.parts[0].text;
                loading.innerHTML = aiReply.replace(/\n/g, '<br>');

            } catch (error) {
                // عرض رسالة الخطأ بشكل واضح كما في الصور
                loading.className = "message ai-msg error-msg";
                loading.innerHTML = "❌ خطأ في النظام: " + error.message;
            } finally {
                btn.disabled = false;
                const win = document.getElementById('chat-window');
                win.scrollTop = win.scrollHeight;
            }
        }

        function appendMsg(content, role) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
            div.innerHTML = content;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
