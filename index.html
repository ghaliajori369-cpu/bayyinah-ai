<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة بَيِّنَة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#1a3a5f;
  --gold:#c9a66b;
  --bg:#f8f9fa;
}

body {
  margin:0;
  font-family:'Cairo','Tajawal',sans-serif;
  background:var(--bg);
  display:flex;
  height:100vh;
}

.sidebar {
  width:250px;
  background:var(--primary);
  color:white;
  padding:15px;
}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat {
  flex:1;
  overflow:auto;
  padding:20px;
}

.message {
  max-width:75%;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  white-space:pre-wrap;
}

.user {
  background:var(--primary);
  color:white;
  margin-left:auto;
}

.ai {
  background:white;
  border:1px solid #ddd;
}

.actions {
  margin-top:8px;
}

button.small {
  font-size:12px;
  padding:5px 8px;
  margin-left:5px;
  cursor:pointer;
}

.input-box {
  display:flex;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

textarea {
  flex:1;
  padding:10px;
  font-size:16px;
  font-family:inherit;
  resize:none;
}

.send-btn {
  background:var(--gold);
  border:none;
  padding:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>بَيِّنَة</h2>
</div>

<div class="main">

  <div class="chat" id="chat"></div>

  <div class="input-box">
    <textarea id="input" rows="2" placeholder="اكتب سؤالك القانوني..."></textarea>
    <button class="send-btn" onclick="sendMessage()">إرسال</button>
  </div>

</div>

<script>
const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw";

/* نظام التلقين */
const SYSTEM_PROMPT = `
أنت مستشار قانوني سعودي.

التزم:
- الأنظمة السعودية
- تحليل دقيق

قسم الرد:
1) الوصف النظامي
2) المواد القانونية
3) التوصية
`;

function addMessage(text, type="user") {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  if(type === "ai") {
    const actions = document.createElement("div");
    actions.className = "actions";

    const copyBtn = document.createElement("button");
    copyBtn.className = "small";
    copyBtn.textContent = "نسخ";
    copyBtn.onclick = () => navigator.clipboard.writeText(text);

    const printBtn = document.createElement("button");
    printBtn.className = "small";
    printBtn.textContent = "طباعة";
    printBtn.onclick = () => printText(text);

    actions.appendChild(copyBtn);
    actions.appendChild(printBtn);
    div.appendChild(actions);
  }

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

function printText(text) {
  const w = window.open("", "", "width=800,height=600");
  w.document.write(`<pre style="font-family:Cairo">${text}</pre>`);
  w.print();
}

/* ====== هذا هو السطر الذي تم تصحيحه بالكامل ====== */
async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                { text: SYSTEM_PROMPT + "\n\nالسؤال:\n" + text }
              ]
            }
          ],
          generationConfig: {
            temperature: 0.3
          }
        })
      }
    );

    const data = await response.json();

    console.log(data); // مهم للتأكد

    let reply = "لم يتم الحصول على رد";

    if (data.candidates && data.candidates.length > 0) {
      reply = data.candidates[0].content.parts[0].text;
    }

    addMessage(reply, "ai");

  } catch (error) {
    addMessage("خطأ في الاتصال", "ai");
  }
}

/* اختصارات */
document.getElementById("input").addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
