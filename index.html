<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بَيِّنَة | المستشار القانوني الذكي</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1a3a5f;
            --gold: #c9a66b;
            --bg: #f4f7f9;
            --white: #ffffff;
            --text: #333;
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: var(--bg);
            display: flex;
            height: 100vh;
            color: var(--text);
            overflow: hidden;
        }

        /* القائمة الجانبية - Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar h2 {
            margin: 0 0 30px;
            text-align: center;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        .new-chat-btn {
            background: var(--gold);
            color: var(--primary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background: #b38f55;
            transform: translateY(-2px);
        }

        .sidebar-footer {
            margin-top: auto;
            font-size: 0.85rem;
            opacity: 0.8;
            text-align: center;
            line-height: 1.6;
        }

        /* المنطقة الرئيسية - Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fdfdfd;
            position: relative;
        }

        /* منطقة الدردشة */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 40px 10%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .message {
            max-width: 85%;
            padding: 18px 22px;
            border-radius: 15px;
            line-height: 1.8;
            font-size: 1.05rem;
            position: relative;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .ai-msg {
            background: #f0f4f8;
            color: var(--text);
            align-self: flex-start;
            border-bottom-right-radius: 2px;
            border-right: 5px solid var(--gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* أزرار التحكم في الرسالة */
        .msg-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--primary);
            transition: 0.2s;
        }

        .action-btn:hover {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }

        /* منطقة الإدخال */
        .input-area {
            padding: 30px 10%;
            border-top: 1px solid #eee;
            background: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            font-family: inherit;
            resize: none;
            min-height: 60px;
            max-height: 200px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--gold);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--gold);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .disclaimer {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }

        /* شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>بَيِّنَة ⚖️</h2>
        <button class="new-chat-btn" onclick="startNewChat()">+ محادثة جديدة</button>
        
        <div class="sidebar-footer">
            منصة "بينة" للتحليل القانوني<br>
            المملكة العربية السعودية<br>
            <small>دعم: info@bayinah.sa</small>
        </div>
    </div>

    <div class="main-content">
        <div id="chat-window">
            <div class="message ai-msg">
                مرحباً بكِ في منصة بَيِّنَة. أنا مستشارك الرقمي للأنظمة السعودية.
                <br>كيف يمكنني مساعدتكِ في تحليل الوقائع اليوم؟
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="اكتبي وقائع القضية هنا للتحليل النظامي..."></textarea>
                <button class="send-btn" id="sendBtn" onclick="handleSend()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="disclaimer">هذا التحليل تقني بناءً على الأنظمة ولا يغني عن استشارة محامي مرخص.</div>
        </div>
    </div>

    <script>
        /* ===================== الإعدادات ===================== */
        const API_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw"; // ⚠️  Groq الخاص بكِ هنا

        const SYSTEM_INSTRUCTION = `أنت مستشار قانوني سعودي خبير ومحترف.
        مهمتك: تحليل الوقائع المقدمة بناءً على الأنظمة السعودية فقط.
        الأسلوب المطلوبة:
        1. الوصف النظامي للواقعة.
        2. المواد القانونية ذات الصلة (ذكر رقم المادة والاسم الكامل للنظام).
        3. التوصية القانونية أو الإجراء المقترح.
        كن دقيقاً جداً، واستخدم لغة قانونية رصينة ومبسطة.`;

        /* ===================== البرمجة المنطقية ===================== */
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let chatHistory = [];

        // دالة إضافة الرسائل للواجهة
        function appendMessage(content, role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            // تنسيق النص (تحويل الأسطر الجديدة لـ <br>)
            const formattedContent = content.replace(/\n/g, '<br>');
            msgDiv.innerHTML = `<div>${formattedContent}</div>`;

            if (role === 'ai') {
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `
                    <button class="action-btn" onclick="copyText(\`${content.replace(/`/g, '\\` ')}\`)">نسخ التحليل</button>
                    <button class="action-btn" onclick="window.print()">طباعة</button>
                `;
                msgDiv.appendChild(actions);
            }

            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgDiv;
        }

        // دالة الإرسال الرئيسية
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;

            // تعطيل الإدخال أثناء المعالجة
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            appendMessage(text, 'user');
            chatHistory.push({ role: "user", content: text });

            const loadingDiv = appendMessage("⏳ جاري استحضار النصوص النظامية وتحليل الوقائع...", 'ai');

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: SYSTEM_INSTRUCTION },
                            ...chatHistory
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const aiReply = data.choices[0].message.content;
                loadingDiv.innerHTML = `<b>📋 التحليل النظامي:</b><br><br>${aiReply.replace(/\n/g, '<br>')}`;
                
                // إضافة الأزرار بعد انتهاء التحميل
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `
                    <button class="action-btn" onclick="copyText(\`${aiReply.replace(/`/g, '\\` ')}\`)">نسخ التحليل</button>
                    <button class="action-btn" onclick="window.print()">طباعة</button>
                `;
                loadingDiv.appendChild(actions);

                chatHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                loadingDiv.innerHTML = `<span style="color:red;">❌ عذراً، حدث خطأ في الاتصال: ${error.message}</span>`;
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        // وظيفة النسخ
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("تم نسخ النص إلى الحافظة");
            });
        }

        // بدء محادثة جديدة
        function startNewChat() {
            chatWindow.innerHTML = '<div class="message ai-msg">تم بدء جلسة تحليل جديدة. تفضلي بطرح تساؤلك القانوني.</div>';
            chatHistory = [];
        }

        // التعديل التلقائي لارتفاع حقل النص
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // دعم الإرسال عبر زر Enter
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
