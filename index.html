<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بينة - المساعد القانوني</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 95%; max-width: 450px; background: white; height: 90vh; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a3a5f; color: white; padding: 20px; text-align: center; font-size: 1.1rem; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
        .ai { background: white; border-right: 4px solid #1a3a5f; align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-box { padding: 15px; border-top: 1px solid #eee; background: white; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; resize: none; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; background: #1a3a5f; color: white; border: none; padding: 12px; border-radius: 10px; margin-top: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">⚖️ بينة - مساعد المحامي الذكي</div>
    <div id="chat">
        <div class="msg ai">مرحباً بك.. أدخل وقائع القضية وسأقوم بتحليلها نظاماً.</div>
    </div>
    <div class="input-box">
        <textarea id="txt" placeholder="اكتب الوقائع هنا..."></textarea>
        <button id="run">إعداد دراسة للمسودة</button>
    </div>
</div>

<script type="importmap">
{ "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
</script>

<script type="module">
import { GoogleGenerativeAI } from "@google/generative-ai";

// ملاحظة: ضعي المفتاح في سطر واحد بين علامتي الاقتباس
const KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw";

const genAI = new GoogleGenerativeAI(KEY);
const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

const btn = document.getElementById('run');
const txt = document.getElementById('txt');
const chat = document.getElementById('chat');

btn.onclick = async () => {
    const val = txt.value.trim();
    if (!val) return alert("أدخل النص أولاً");

    btn.disabled = true;
    btn.innerText = "جاري التحليل...";

    const m = document.createElement('div');
    m.className = 'msg ai';
    m.innerHTML = "⏳ جاري المعالجة...";
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;

    try {
        const prompt = "أنت محامي سعودي مستشار، حلل الوقائع التالية واذكر الأنظمة السعودية ذات العلاقة: " + val;
        const res = await model.generateContent(prompt);
        const out = await res.response;
        m.innerHTML = "<b>📋 النتيجة:</b><br><br>" + out.text().replace(/\n/g, '<br>');
    } catch (err) {
        m.innerHTML = "❌ خطأ: " + err.message;
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.innerText = "إعداد دراسة للمسودة";
        chat.scrollTop = chat.scrollHeight;
    }
};
</script>

</body>
</html>
