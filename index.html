<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بينة - فحص الاتصال</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f7f9; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ccc; padding: 10px; }
        button { background: #1a3a5f; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        #status { margin-top: 20px; color: #d9534f; font-weight: bold; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2>⚖️ تطبيق بينة</h2>
    <textarea id="userInput" placeholder="اكتبي وقائع القضية هنا..."></textarea>
    <button id="checkBtn">تحليل الآن</button>
    <div id="status"></div>
</div>

<script type="importmap">
{ "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
</script>

<script type="module">
import { GoogleGenerativeAI } from "@google/generative-ai";

// استبدلي المفتاح أدناه وتأكدي أنه بين علامتي الاقتباس " "
const MY_KEY = "AIzaSyDDnwx4f6TKJQXiK1LoAhBA37hBtaHlogw";
document.getElementById('checkBtn').onclick = async () => {
    const status = document.getElementById('status');
    const text = document.getElementById('userInput').value;
    
    if(!text) { alert("اكتبي شيئاً أولاً"); return; }

    status.innerText = "⏳ جاري محاولة الاتصال بجوجل...";

    try {
        const genAI = new GoogleGenerativeAI(MY_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
        
        const result = await model.generateContent("حلل نظاماً: " + text);
        const response = await result.response;
        status.style.color = "green";
        status.innerHTML = "✅ تم الاتصال بنجاح:<br>" + response.text();
    } catch (error) {
        status.style.color = "red";
        status.innerText = "❌ حدث خطأ:\n" + error.message;
        console.error(error);
    }
};
</script>

</body>
</html>
